name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint Code & Validate Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Validate Web App Build
        run: npm run build

      - name: Validate WiX XML Schema
        run: |
          # Basic XML validation for Product.wxs
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('Product.wxs'); print('Product.wxs XML syntax is valid')"
